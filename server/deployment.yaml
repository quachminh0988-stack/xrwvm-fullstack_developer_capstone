apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: dealership
  name: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dealership
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: dealership
    spec:
      imagePullSecrets:
      - name: icr
      containers:
      - image: us.icr.io/sn-labs-quachminh098/dealership:latest
        imagePullPolicy: Always
        name: dealership
        env:
        - name: backend_url
          value: "http://dealership-api:3030"
        - name: sentiment_analyzer_url
          value: "http://sentiment-analyzer:5000"
        ports:
        - containerPort: 8000
          protocol: TCP
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: dealership
spec:
  selector:
    run: dealership
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP
